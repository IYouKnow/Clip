[workspace]
resolver = "2"
members = ["src-tauri", "crates/engine", "crates/library"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["trace"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
crossbeam-channel = "0.5"
tracing = "0.1"

# Keep the release profile at the workspace root; member manifests cannot define it.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
