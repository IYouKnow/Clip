<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Trace">
  <defs>
    <linearGradient id="trace-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171b" />
      <stop offset="1" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="trace-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8354" />
      <stop offset="1" stop-color="#ff2e63" />
    </linearGradient>
    <filter id="trace-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.7" />
    </filter>
  </defs>
  <rect width="32" height="32" rx="7.2" fill="url(#trace-tile)" />
  <g fill="url(#trace-mark)">
    <g filter="url(#trace-glow)" opacity="0.75">
      <rect x="8.2" y="8.9" width="15.7" height="3.7" rx="1.85" />
      <rect x="13.4" y="8.9" width="5.2" height="14.4" rx="2.6" />
    </g>
    <rect x="8.2" y="8.9" width="15.7" height="3.7" rx="1.85" />
    <rect x="13.4" y="8.9" width="5.2" height="14.4" rx="2.6" />
  </g>
</svg>
