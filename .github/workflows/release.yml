name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # FFmpeg and libclang are vendored (gitignored); the Rust build links
      # against them and fetch-ffmpeg.ps1 also mirrors the DLLs into the bundle.
      - name: Vendor libclang
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/fetch-libclang.ps1

      - name: Vendor FFmpeg
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/fetch-ffmpeg.ps1

      # The release version always comes from the tag (v1.2.3 -> 1.2.3).
      - name: Sync version from tag
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')" $v

      # Copying the key or password can pick up stray whitespace, which breaks
      # base64 decoding and the password check. Normalize both, and print only
      # their lengths so a wrong value is distinguishable from an empty secret
      # (a mistyped secret name) without leaking anything.
      - name: Normalize signing secrets
        shell: pwsh
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $key = ($env:RAW_SIGNING_KEY -replace '\s', '')
          $password = ($env:RAW_SIGNING_PASSWORD -replace '[\r\n]', '')
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$key"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password"
          Write-Output "signing key: $($key.Length) chars; password: $($password.Length) chars"

      # Fail in seconds when the key/password pair is wrong, rather than after
      # a full release build.
      - name: Verify signing key
        shell: pwsh
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\probe.txt" -Value 'probe' -NoNewline
          pnpm tauri signer sign "$env:RUNNER_TEMP\probe.txt"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clipper23 ${{ github.ref_name }}"
          releaseBody: "Installers below. Existing installs will update automatically."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: pnpm tauri
